name: Build KernelSU Debug Module

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths:
      - 'kernelsu-debug/**'
      - 'manager/**'
      - 'server/**'
      - 'starter/**'
      - '.github/workflows/ksu-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate KernelSU module
        run: |
          set -eux
          test -f kernelsu-debug/module.prop
          grep -q '^id=shizuku_tokenx_debug$' kernelsu-debug/module.prop
          grep -q '^versionCode=[0-9][0-9]*$' kernelsu-debug/module.prop
          for f in customize.sh common.sh service.sh boot-completed.sh action.sh; do
            test -f "kernelsu-debug/$f"
            sed -i 's/\r$//' "kernelsu-debug/$f"
          done
          chmod 0755 kernelsu-debug/*.sh
      - name: Validate installable root layout
        run: |
          set -eux
          test -f kernelsu-debug/module.prop
          test -f kernelsu-debug/customize.sh
          test -f kernelsu-debug/service.sh
          ! test -e kernelsu-debug/kernelsu-debug
      - name: Upload flashable KernelSU module contents
        uses: actions/upload-artifact@v6
        with:
          name: Shizuku-TokenX-SystemServer-Boot-Debug-v1.1.1-FLASHABLE
          path: |
            kernelsu-debug/module.prop
            kernelsu-debug/customize.sh
            kernelsu-debug/common.sh
            kernelsu-debug/service.sh
            kernelsu-debug/boot-completed.sh
            kernelsu-debug/action.sh
          include-hidden-files: true
          if-no-files-found: error
