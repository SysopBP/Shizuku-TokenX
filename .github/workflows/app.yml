name: Build App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 14.0.3. Leave blank to bump the patch of the current one.'
        type: string
        required: false
      prerelease:
        description: 'Prerelease'
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      KEYSTORE: ${{ secrets.KEYSTORE }}
    outputs:
      versionName: ${{ steps.buildWithGradle.outputs.versionName }}
      debugArtifact: ${{ steps.buildWithGradle.outputs.debugArtifact }}
      releaseArtifact: ${{ steps.buildWithGradle.outputs.releaseArtifact }}
      hasSigning: ${{ steps.signing.outputs.available }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          submodules: 'recursive'
          fetch-depth: 0

      - name: Bump Version
        id: bumpVersion
        run: |
          CURRENT=$(grep -oP 'baseVersionName = "\K[0-9]+\.[0-9]+\.[0-9]+' build.gradle)
          WANTED="${{ inputs.version }}"
          [ -z "$WANTED" ] && WANTED=$(echo "$CURRENT" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
          echo "current $CURRENT, building $WANTED"
          echo "$WANTED" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Invalid version"; exit 1; }
          echo "version=$WANTED" >> $GITHUB_OUTPUT
          if [ "$WANTED" != "$CURRENT" ]; then
            sed -i "s/baseVersionName = \"$CURRENT\"/baseVersionName = \"$WANTED\"/" build.gradle
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: bump version to $WANTED [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Detect Signing Config
        id: signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.KEYSTORE_ALIAS_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEYSTORE_ALIAS" ] && [ -n "$KEYSTORE_ALIAS_PASSWORD" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Release signing configured; debug and release APKs will be built."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing is not configured. Building the debug APK only."
          fi

      - name: Create signing.properties
        if: steps.signing.outputs.available == 'true'
        run: |
          echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
          echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
          echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
          echo KEYSTORE_FILE=../key.jks >> signing.properties
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > key.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        id: buildWithGradle
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          echo 'org.gradle.caching=true' >> gradle.properties
          echo 'org.gradle.parallel=true' >> gradle.properties

          CMD="./gradlew :manager:assembleDebug"
          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            CMD="$CMD :manager:assembleRelease"
          fi
          [ "${{ inputs.prerelease }}" = "true" ] && CMD="$CMD -Pbeta"
          eval "$CMD"

          DEBUG_FILE=$(ls manager/build/outputs/apk/debug/*.apk | head -1)
          DEBUG_BUILD=$(basename "$DEBUG_FILE" | sed -E 's/^shizuku-(.*)-debug\.apk/\1/')
          DEBUG_NAME="shizuku-$DEBUG_BUILD-debug.apk"
          DEBUG_RENAMED="$(dirname "$DEBUG_FILE")/$DEBUG_NAME"
          [ "$DEBUG_FILE" = "$DEBUG_RENAMED" ] || mv "$DEBUG_FILE" "$DEBUG_RENAMED"
          echo "debugArtifact=$DEBUG_NAME" >> "$GITHUB_OUTPUT"
          echo "debugFilePath=$DEBUG_RENAMED" >> "$GITHUB_OUTPUT"
          echo "versionName=$DEBUG_BUILD" >> "$GITHUB_OUTPUT"

          if [ "${{ steps.signing.outputs.available }}" = "true" ]; then
            RELEASE_FILE=$(ls manager/build/outputs/apk/release/*.apk | head -1)
            RELEASE_NAME="shizuku-$DEBUG_BUILD.apk"
            RELEASE_RENAMED="$(dirname "$RELEASE_FILE")/$RELEASE_NAME"
            [ "$RELEASE_FILE" = "$RELEASE_RENAMED" ] || mv "$RELEASE_FILE" "$RELEASE_RENAMED"
            echo "releaseArtifact=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
            echo "releaseFilePath=$RELEASE_RENAMED" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Debug Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.buildWithGradle.outputs.debugArtifact }}
          path: ${{ steps.buildWithGradle.outputs.debugFilePath }}

      - name: Upload Release Artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.buildWithGradle.outputs.releaseArtifact }}
          path: ${{ steps.buildWithGradle.outputs.releaseFilePath }}

      - name: Attest Build Provenance
        if: ${{ success() }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: manager/build/outputs/apk/**/*.apk

  release:
    needs: [build]
    if: needs.build.outputs.hasSigning == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: 'shizuku-*'
          path: files
          merge-multiple: true
      - name: Create Draft Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.build.outputs.versionName }}
        run: |
          FLAGS="--draft"
          [ "${{ inputs.prerelease }}" = "true" ] && FLAGS="$FLAGS --prerelease"
          if gh release view "$RELEASE_VERSION" --json id > /dev/null 2>&1; then
            gh release upload "$RELEASE_VERSION" files/*.apk --clobber
          else
            gh release create "$RELEASE_VERSION" files/*.apk --title "$RELEASE_VERSION" --generate-notes $FLAGS
          fi
