name: TokenX UID1000 Controlled Test

on:
  workflow_dispatch:
  push:
    branches:
      - uid1000-test-bd68f0e
    paths:
      - 'uidtest/**'
      - 'settings.gradle'
      - '.github/workflows/uid1000-test.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build isolated UID test APK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact test branch
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build disposable UID test
        run: ./gradlew :uidtest:assembleDebug --stacktrace

      - name: Verify manifest request
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find uidtest/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/aapt2" dump xmltree "$APK" --file AndroidManifest.xml | grep -F 'android.uid.system'
          mkdir -p uidtest-artifact
          cp "$APK" uidtest-artifact/TokenX-UIDTest.apk

      - name: Upload disposable UID test
        uses: actions/upload-artifact@v6
        with:
          name: TokenX-UIDTest
          path: uidtest-artifact/TokenX-UIDTest.apk
          if-no-files-found: error
          retention-days: 7
