plugins { id "com.android.library" }

android {
    namespace = "moe.shizuku.tokenx.xposed"
    buildFeatures { buildConfig = true }
    defaultConfig {
        buildConfigField "int", "TOKENX_VERSION_CODE", rootProject.ext.versionCode.toString()
    }
}

dependencies {
    // Modern Xposed API. LSPosed supplies the implementation at runtime.
    compileOnly "io.github.libxposed:api:102.0.0"
    compileOnly libs.hidden.stub
    compileOnly project(":server")
    compileOnly project(":server-shared")
}

