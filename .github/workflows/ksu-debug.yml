name: Build KernelSU Debug Module

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'kernelsu-debug/**'
      - '.github/workflows/ksu-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Validate module
        run: |
          set -eux
          test -f kernelsu-debug/module.prop
          grep -q '^id=shizuku_tokenx_debug$' kernelsu-debug/module.prop
          grep -q '^versionCode=[0-9][0-9]*$' kernelsu-debug/module.prop
          for f in customize.sh common.sh service.sh boot-completed.sh action.sh; do
            test -f "kernelsu-debug/$f"
            sed -i 's/\r$//' "kernelsu-debug/$f"
          done
          chmod 0755 kernelsu-debug/*.sh
      - name: Package KernelSU module
        run: |
          set -eux
          mkdir -p dist
          (
            cd kernelsu-debug
            zip -r -9 ../dist/Shizuku-TokenX-SystemServer-Boot-Debug-v1.1.0.zip . -x '*.DS_Store'
          )
          unzip -l dist/Shizuku-TokenX-SystemServer-Boot-Debug-v1.1.0.zip
          unzip -p dist/Shizuku-TokenX-SystemServer-Boot-Debug-v1.1.0.zip module.prop | grep -q '^id=shizuku_tokenx_debug$'
      - name: Upload KernelSU ZIP
        uses: actions/upload-artifact@v6
        with:
          name: Shizuku-TokenX-SystemServer-Boot-Debug-v1.1.0
          path: dist/Shizuku-TokenX-SystemServer-Boot-Debug-v1.1.0.zip
          if-no-files-found: error
