name: TokenX Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - tokenx-dev
      - tokenx-recovery
    paths:
      - 'manager/**'
      - 'xposed/**'
      - 'common/**'
      - 'server/**'
      - 'shell/**'
      - 'starter/**'
      - 'api'
      - 'build.gradle'
      - 'build.gradle.compileSdk36'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tokenx-debug.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: tokenx-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Build TokenX Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout TokenX
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Patch rish for Android 17 system_server fork safety
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("api/rish/src/main/cpp/rikka_rish_RishHost.cpp")
          s = path.read_text()

          # Resolve the PTY slave name before fork. The child must not call
          # logging/JNI/Binder-adjacent runtime code inherited from system_server.
          needle = "    auto pid = fork();\n"
          insert = """    char pts_slave[PATH_MAX]{0};
    if (tty && ptsname_r(ptmx, pts_slave, PATH_MAX - 1) == -1) {
        releaseBytes(env, argBlock, pargBlock);
        releaseBytes(env, envBlock, penvBlock);
        releaseBytes(env, dirBlock, pdir);
        env->ThrowNew(env->FindClass("java/lang/IllegalStateException"), "Unable to resolve pts");
        return nullptr;
    }

    auto pid = fork();
"""
          if needle not in s:
              raise SystemExit("TokenX rish patch: fork anchor not found")
          s = s.replace(needle, insert, 1)

          child = r'''    } else {
        // TokenX embeds RishService in system_server. libbinder marks ProcessState
        // unusable in a post-fork child, so keep this path syscall-only until exec.
        // In particular: no LOG/PLOG, JNI, Binder, access(), execvp/execvpe, or exit().
        if (setsid() < 0) {
            _exit(126);
        }

        if (pdir && chdir(pdir) == -1) {
            // Preserve historical behavior: an invalid cwd is non-fatal.
        }

        int pts = -1;
        if (tty) {
            pts = open(pts_slave, O_RDWR);
            if (pts == -1) {
                _exit(126);
            }
        }

        if (in_tty) {
            if (dup2(pts, STDIN_FILENO) == -1) _exit(126);
        } else {
            if (dup2(stdin_pipe[0], STDIN_FILENO) == -1) _exit(126);
            close(stdin_pipe[1]);
        }

        if (out_tty) {
            if (dup2(pts, STDOUT_FILENO) == -1) _exit(126);
        } else {
            if (dup2(stdout_pipe[1], STDOUT_FILENO) == -1) _exit(126);
            close(stdout_pipe[0]);
        }

        if (err_tty) {
            if (dup2(pts, STDERR_FILENO) == -1) _exit(126);
        } else {
            if (dup2(stderr_pipe[1], STDERR_FILENO) == -1) _exit(126);
            close(stderr_pipe[0]);
        }

        if (pts != -1) close(pts);
        if (ptmx != -1) close(ptmx);

        if (!in_tty) close(stdin_pipe[0]);
        if (!out_tty) close(stdout_pipe[1]);
        if (!err_tty) close(stderr_pipe[1]);

        extern char **environ;
        char *const *child_env = envv
                ? (char *const *) envv
                : environ;

        execve("/system/bin/sh", (char *const *) argv, child_env);
        _exit(127);
    }
}'''

          pattern = re.compile(
              r"    \} else \{\n        if \(setsid\(\) < 0\) \{.*?\n    \}\n\}\n(?=\nstatic void RishHost_setWindowSize)",
              re.S,
          )
          s2, n = pattern.subn(child, s, count=1)
          if n != 1:
              raise SystemExit(f"TokenX rish patch: child block matches={n}")

          path.write_text(s2)
          print("TokenX Android 17 fork-safe rish child patch applied")
          PY

          grep -nE 'fork\(\)|execve|_exit|pts_slave' api/rish/src/main/cpp/rikka_rish_RishHost.cpp

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        env:
          # tribalfs SESL is hosted in another GitHub owner namespace. A repository
          # GITHUB_TOKEN cannot reliably read that package, so prefer a read-only PAT.
          # Add SESL_GITHUB_USERNAME and SESL_GITHUB_TOKEN in repository Actions secrets.
          # The token should be a classic PAT with read:packages only.
          GITHUB_ACTOR: ${{ secrets.SESL_GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.SESL_GITHUB_TOKEN }}
        run: ./gradlew :manager:assembleDebug --stacktrace

      - name: Verify TokenX Xposed packaging
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find manager/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$FILE"
          unzip -l "$FILE" | grep -F 'META-INF/xposed/java_init.list'
          unzip -l "$FILE" | grep -F 'META-INF/xposed/scope.list'
          unzip -l "$FILE" | grep -F 'META-INF/xposed/module.prop'
          echo "TokenX modern Xposed module metadata verified in manager APK"

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(find manager/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$FILE"
          mkdir -p tokenx-artifacts
          cp "$FILE" tokenx-artifacts/Shizuku-TokenX-debug.apk
          echo "apk=tokenx-artifacts/Shizuku-TokenX-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Upload TokenX debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Shizuku-TokenX-debug
          path: ${{ steps.apk.outputs.apk }}
          if-no-files-found: error
          retention-days: 14
