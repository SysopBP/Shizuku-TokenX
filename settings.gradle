pluginManagement {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
        maven {
            url = "https://plugins.gradle.org/m2/"
        }
    }
    plugins {
        id "com.android.application" version "8.11.1"
        id "com.android.library" version "8.11.1"
        id "org.jetbrains.kotlin.android" version "2.2.20"
        id "org.jetbrains.kotlin.plugin.compose" version "2.2.20"
        id "org.jetbrains.kotlin.plugin.serialization" version "2.2.20"
        id "dev.rikka.tools.autoresconfig" version "1.2.2"
        id "dev.rikka.tools.materialthemebuilder" version "1.5.1"
        id "dev.rikka.tools.refine" version "4.4.0"
    }

}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenLocal()
        mavenCentral()

        // TokenX SESL bridge: tribalfs publishes SESL through GitHub Packages.
        // Local builds: export GITHUB_ACTOR and GITHUB_TOKEN (classic PAT with read:packages).
        // CI uses the repository GITHUB_TOKEN where package access permits it.
        def ghActor = System.getenv("GITHUB_ACTOR") ?: providers.gradleProperty("gpr.user").orNull
        def ghToken = System.getenv("GITHUB_TOKEN") ?: providers.gradleProperty("gpr.key").orNull
        if (ghActor && ghToken) {
            maven {
                name = "TribalfsSeslAndroidx"
                url = uri("https://maven.pkg.github.com/tribalfs/sesl-androidx")
                credentials {
                    username = ghActor
                    password = ghToken
                }
                content { includeGroupByRegex("sesl\\.androidx(\\..*)?") }
            }
            maven {
                name = "TribalfsSeslMaterial"
                url = uri("https://maven.pkg.github.com/tribalfs/sesl-material-components-android")
                credentials {
                    username = ghActor
                    password = ghToken
                }
                content { includeGroupByRegex("sesl\\.com\\.google\\.android\\.material") }
            }
        }

        maven {
            url = "https://jitpack.io"
            content {
                includeGroup("com.github.topjohnwu.libsu")
            }
        }
    }
    versionCatalogs {
        libs {
            version("hidden-api", "4.4.0")
            library("hidden-compat", "dev.rikka.hidden", "compat").versionRef("hidden-api")
            library("hidden-stub", "dev.rikka.hidden", "stub").versionRef("hidden-api")

            version("refine", "4.4.0")
            library("refine-runtime", "dev.rikka.tools.refine", "runtime").versionRef("refine")
            library("refine-annotation", "dev.rikka.tools.refine", "annotation").versionRef("refine")
            library("refine-annotation-processor", "dev.rikka.tools.refine", "annotation-processor").versionRef("refine")
        }
    }
}

include ":server", ":starter", ":shell", ":manager", ":common"

def root = "api"

def propFile = file("local.properties")
def props = new Properties()

if (propFile.canRead()) {
    props.load(new FileInputStream(propFile))

    if (props != null) {
        if (props["api.useLocal"].equals("true")) {
            root = props["api.dir"]
        }
    }
}

include ":aidl"
project(":aidl").projectDir = file("$root${File.separator}aidl")

include ":rish"
project(":rish").projectDir = file("$root${File.separator}rish")

include ":shared"
project(":shared").projectDir = file("$root${File.separator}shared")

include ":api"
project(":api").projectDir = file("$root${File.separator}api")

include ":provider"
project(":provider").projectDir = file("$root${File.separator}provider")

include ":server-shared"
project(":server-shared").projectDir = file("$root${File.separator}server-shared")
